name: Publicar web

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Instalar librerías (imágenes para compartir y certificados)
        run: pip install pillow certifi
      - name: Armar la web
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: python build.py
      - name: Control SEO del sitio (informe en el resumen de esta ejecución)
        continue-on-error: true
        run: python auditar.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: sitio
      - id: deploy
        uses: actions/deploy-pages@v4
      - name: Avisar a Bing y buscadores (IndexNow)
        continue-on-error: true
        run: sleep 20 && python indexnow.py
