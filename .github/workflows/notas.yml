name: Fábrica de notas

on:
  schedule:
    # cada 2 horas de 7 a 23 (hora de Argentina = UTC-3)
    - cron: "7 10-23/2 * * *"
    - cron: "7 0,2 * * *"
    # una vuelta de madrugada (4 h) para lo que sale en el Boletín Oficial
    - cron: "7 7 * * *"
  workflow_dispatch:

permissions:
  contents: write   # la fábrica guarda los ajustes de las guías fáciles (explicado/*.json)
  actions: write

concurrency:
  group: notas
  cancel-in-progress: false

jobs:
  notas:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Buscar novedades y escribir notas
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m fabrica.main
